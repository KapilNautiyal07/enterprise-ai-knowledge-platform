services:
  - type: web
    name: enterprise-ai-knowledge-api
    runtime: python
    plan: free
    rootDir: backend
    # Importing the model modules downloads the ONNX models during the build,
    # so cold starts do not have to fetch them again.
    buildCommand: pip install -r requirements.txt && python -c "import app.rag.embeddings, app.rag.reranker"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
